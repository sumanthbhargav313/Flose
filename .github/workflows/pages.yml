name: Publish Flose and refresh retail prices
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flose-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Refresh verified retail snapshot
        run: python3 _pricing/update.py
      - name: Preserve verified prices for the next build
        run: |
          if ! git diff --quiet -- _pricing/catalog.json catalog.js; then
            git add _pricing/catalog.json catalog.js
            git -c user.name='Flose price refresh' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh verified retail price snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public assets
        run: |
          mkdir -p _site
          cp index.html styles.css app.js food.js catalog.js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
